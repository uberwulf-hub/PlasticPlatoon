# Builds the Windows version and publishes a GitHub release for SauceStore.
# Run it from the Actions tab: "Release" -> "Run workflow", enter a version like v1.0.1.
# SauceStore lists the new version within ~10 minutes (it reads saucestore.json from the release tag).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT: ./Godot_v4.3-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.3 and the Windows export template
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          T=~/.local/share/godot/export_templates/4.3.stable
          mkdir -p $T
          unzip -q -j Godot_v4.3-stable_export_templates.tpz templates/version.txt templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe -d $T
          rm Godot_v4.3-stable_export_templates.tpz

      - name: Put our icon and version info into the Windows template
        # Godot 4.3 needs the Windows-only rcedit to do this at export time, so
        # patch the template itself (pure-JS resedit works on Linux); Godot then
        # appends the game data to an exe that already has the right icon.
        run: |
          V="${{ inputs.version }}"; V="${V#v}"
          while [ "$(echo "$V" | tr -cd . | wc -c)" -lt 3 ]; do V="$V.0"; done
          T=~/.local/share/godot/export_templates/4.3.stable/windows_release_x86_64.exe
          npx --yes resedit-cli@2 --in "$T" --out "$T.new" \
            --icon GODOT_ICON,store/icon.ico \
            --product-name "Plastic Platoon: Revenge 2026" --file-description "Plastic Platoon: Revenge 2026" \
            --company-name "uberwulf-hub" --original-filename "PlasticPlatoon.exe" --internal-name "PlasticPlatoon" \
            --product-version "$V" --file-version "$V"
          mv "$T.new" "$T"

      - name: Import assets
        run: $GODOT --headless --editor --quit || true

      - name: Smoke test (plays through every operation)
        run: $GODOT --headless --path . res://tests/smoke_test.tscn

      - name: Campaign test (all 13 operations, objectives + news)
        run: $GODOT --headless --path . res://tests/campaign_test.tscn

      - name: Squad test (friendly AI follows, fights, holds, respawns)
        run: $GODOT --headless --path . res://tests/squad_test.tscn

      - name: Meltdown test (waves, coins, stations, doors)
        run: $GODOT --headless --path . res://tests/meltdown_test.tscn

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          $GODOT --headless --path . --export-release "Windows Desktop" build/windows/PlasticPlatoon.exe
          test -s build/windows/PlasticPlatoon.exe

      - name: Package zip (name must match saucestore.json "assets")
        run: |
          mkdir -p dist/PlasticPlatoon/licenses
          cp build/windows/PlasticPlatoon.exe CREDITS.md dist/PlasticPlatoon/
          cp licenses/*.txt dist/PlasticPlatoon/licenses/
          cp store/README-windows.txt dist/PlasticPlatoon/README.txt
          cd dist && zip -qr -9 PlasticPlatoon-windows.zip PlasticPlatoon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.version }}" dist/PlasticPlatoon-windows.zip \
            --target "${{ github.sha }}" \
            --title "Plastic Platoon: Revenge 2026 ${{ inputs.version }}" \
            --notes "Windows build. Unzip and run PlasticPlatoon.exe. All third-party assets are CC0; see CREDITS.md."

# Builds the Windows version, publishes a GitHub release for SauceStore, then
# builds the Android APK and attaches it to the same release.
# Run it from the Actions tab: "Release" -> "Run workflow", enter a version like v1.0.1.
# SauceStore lists the new version within ~10 minutes (it reads saucestore.json from the release tag).
name: Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Release even if one already ran today"
        type: boolean
        default: false
      version:
        description: "Version tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"

permissions:
  actions: read
  contents: write

jobs:
  once-a-day:
    # Keeps GitHub's free 2,000 build minutes a month in budget: one release a day (days in UTC). To release again
    # today anyway, run this workflow by hand with "Release even if one already ran today" ticked.
    runs-on: ubuntu-latest
    steps:
      - name: Only one release a day
        if: ${{ !inputs.force }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          wf=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?created=$(date -u +%Y-%m-%d)&status=success" --jq .total_count)
          if [ "$n" -gt 0 ]; then
            echo "::error::A release already ran today. To release again anyway, run it by hand with 'Release even if one already ran today' ticked."
            exit 1
          fi

  release:
    needs: once-a-day
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT: ./Godot_v4.3-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.3 and the Windows export template
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          T=~/.local/share/godot/export_templates/4.3.stable
          mkdir -p $T
          unzip -q -j Godot_v4.3-stable_export_templates.tpz templates/version.txt templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe -d $T
          rm Godot_v4.3-stable_export_templates.tpz

      - name: Put our icon and version info into the Windows template
        # Godot 4.3 needs the Windows-only rcedit to do this at export time, so
        # patch the template itself (pure-JS resedit works on Linux); Godot then
        # appends the game data to an exe that already has the right icon.
        run: |
          V="${{ inputs.version }}"; V="${V#v}"
          while [ "$(echo "$V" | tr -cd . | wc -c)" -lt 3 ]; do V="$V.0"; done
          T=~/.local/share/godot/export_templates/4.3.stable/windows_release_x86_64.exe
          npx --yes resedit-cli@2 --in "$T" --out "$T.new" \
            --icon GODOT_ICON,store/icon.ico \
            --product-name "Plastic Platoon: Revenge 2026" --file-description "Plastic Platoon: Revenge 2026" \
            --company-name "uberwulf-hub" --original-filename "PlasticPlatoon.exe" --internal-name "PlasticPlatoon" \
            --product-version "$V" --file-version "$V"
          mv "$T.new" "$T"

      - name: Import assets
        # --import waits until every asset is imported (--editor --quit could exit
        # early, leaving the tests without models or sounds). Fail loudly if so.
        run: |
          $GODOT --headless --path . --import || true
          N=$(find .godot/imported -type f | wc -l)
          echo "imported files: $N"
          if [ "$N" -lt 500 ]; then $GODOT --headless --path . --import || true; N=$(find .godot/imported -type f | wc -l); echo "after a second pass: $N"; fi
          test "$N" -ge 500

      - name: Smoke test (plays through every operation)
        run: $GODOT --headless --path . res://tests/smoke_test.tscn

      - name: Campaign test (all 13 operations, objectives + news)
        run: $GODOT --headless --path . res://tests/campaign_test.tscn

      - name: Squad test (friendly AI follows, fights, holds, respawns)
        run: $GODOT --headless --path . res://tests/squad_test.tscn

      - name: Meltdown test (waves, coins, stations, doors)
        run: $GODOT --headless --path . res://tests/meltdown_test.tscn

      - name: Co-op test over LAN (host + client)
        run: |
          $GODOT --headless --path . res://tests/mp_test.tscn -- host > host.log 2>&1 &
          HP=$!
          sleep 3
          $GODOT --headless --path . res://tests/mp_test.tscn -- client; C=$?
          wait $HP; H=$?
          cat host.log | grep -E "PASS|FAIL|===="
          test $C -eq 0 -a $H -eq 0

      - name: MELTDOWN co-op test (host + client)
        run: |
          $GODOT --headless --path . res://tests/md_coop_test.tscn -- host > host.log 2>&1 &
          HP=$!
          sleep 3
          $GODOT --headless --path . res://tests/md_coop_test.tscn -- client; C=$?
          wait $HP; H=$?
          cat host.log | grep -E "PASS|FAIL|===="
          test $C -eq 0 -a $H -eq 0

      - name: Co-op and friends tests online (through a local copy of the relay)
        run: |
          (cd tools/relay_local && npm install --no-audit --no-fund && node local.mjs) &
          sleep 3
          export PLATOON_RELAY_URL=ws://127.0.0.1:24690
          $GODOT --headless --path . res://tests/mp_test.tscn -- host_online code.txt > host.log 2>&1 &
          HP=$!
          sleep 3
          $GODOT --headless --path . res://tests/mp_test.tscn -- client_online code.txt; C=$?
          wait $HP; H=$?
          cat host.log | grep -E "PASS|FAIL|===="
          test $C -eq 0 -a $H -eq 0
          # Friends: see each other playing, invite, join from the invite.
          export PLATOON_FRIENDS_TEST=1
          $GODOT --headless --path . res://tests/friends_test.tscn -- dad > dad.log 2>&1 &
          DP=$!
          sleep 1
          $GODOT --headless --path . res://tests/friends_test.tscn -- kid; K=$?
          wait $DP; D=$?
          cat dad.log | grep -E "PASS|FAIL|===="
          test $K -eq 0 -a $D -eq 0

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          $GODOT --headless --path . --export-release "Windows Desktop" build/windows/PlasticPlatoon.exe
          test -s build/windows/PlasticPlatoon.exe

      - name: Package zip (name must match saucestore.json "assets")
        run: |
          mkdir -p dist/PlasticPlatoon/licenses
          cp build/windows/PlasticPlatoon.exe CREDITS.md dist/PlasticPlatoon/
          cp licenses/*.txt dist/PlasticPlatoon/licenses/
          cp store/README-windows.txt dist/PlasticPlatoon/README.txt
          cd dist && zip -qr -9 PlasticPlatoon-windows.zip PlasticPlatoon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.version }}" dist/PlasticPlatoon-windows.zip \
            --target "${{ github.sha }}" \
            --title "Plastic Platoon: Revenge 2026 ${{ inputs.version }}" \
            --notes "Windows: download PlasticPlatoon-windows.zip, unzip it and run PlasticPlatoon.exe. Android: download PlasticPlatoon-android.apk on your phone and open it (allow installs from your browser or file app when asked); updates install over the old version and keep your progress. The APK is added a few minutes after this release appears. Third-party art, audio and textures are CC0, the PNN voices were made with Kokoro-82M (Apache-2.0), and the Godot engine is MIT; see CREDITS.md."

  android:
    needs: release
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ inputs.version }}
      release: ${{ inputs.version }}
    secrets: inherit

# Builds the Android APK (arm64, sideload). Every Release runs this and attaches
# PlasticPlatoon-android.apk; you can also run it alone from the Actions tab:
# "Android" -> "Run workflow". The APK is kept as a workflow artifact, and when
# "release" names an existing GitHub release (e.g. v1.10.0) it is attached there too.
#
# Signing: Android only installs an update over an older copy when both were
# signed with the same key. The first build makes a key and keeps it in this
# repository's Actions cache (keep-android-key.yml stops GitHub expiring it).
# To use your own key instead, set the repository secrets ANDROID_KEYSTORE_BASE64
# (base64 of a .jks/.keystore), ANDROID_KEYSTORE_ALIAS and ANDROID_KEYSTORE_PASSWORD.
name: Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. v1.10.0 (sets the APK's version name/code)"
        required: true
        default: "v1.0.0"
      release:
        description: "Attach the APK to this existing release tag (leave empty to skip)"
        required: false
        default: ""
  workflow_call:          # the Release workflow builds the APK too
    inputs:
      version:
        type: string
        required: true
      release:
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT: ./Godot_v4.3-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot 4.3 and the Android export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          T=~/.local/share/godot/export_templates/4.3.stable
          mkdir -p $T
          unzip -q -j Godot_v4.3-stable_export_templates.tpz templates/version.txt templates/android_release.apk templates/android_debug.apk -d $T
          rm Godot_v4.3-stable_export_templates.tpz

      - name: Point Godot at the Android SDK and Java
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.3.tres
          cat ~/.config/godot/editor_settings-4.3.tres
          ls "$ANDROID_HOME/build-tools"

      - name: Keep the signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/android-key
          key: android-signing-key-v1

      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            KS="$RUNNER_TEMP/release.keystore"
            echo "$KS_B64" | base64 -d > "$KS"
            ALIAS="$KS_ALIAS"; PASS="$KS_PASS"
            echo "Using the signing key from the repository secrets."
          else
            mkdir -p ~/android-key
            KS=~/android-key/release.keystore
            ALIAS=plasticplatoon
            if [ ! -f "$KS" ]; then
              openssl rand -hex 16 > ~/android-key/password
              keytool -genkeypair -v -keystore "$KS" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$(cat ~/android-key/password)" -keypass "$(cat ~/android-key/password)" \
                -dname "CN=Plastic Platoon, O=uberwulf, C=US"
              echo "::warning::Made a new signing key. Phones with an older copy must uninstall it before installing this one."
            else
              echo "Using the cached signing key."
            fi
            PASS=$(cat ~/android-key/password)
          fi
          echo "::add-mask::$PASS"
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"

      - name: Set the version
        run: |
          V="${{ inputs.version }}"; V="${V#v}"
          IFS=. read -r A B C <<< "$V"
          CODE=$(( ${A:-0} * 10000 + ${B:-0} * 100 + ${C:-0} ))
          sed -i "s/^version\/code=.*/version\/code=$CODE/; s/^version\/name=.*/version\/name=\"$V\"/" export_presets.cfg
          grep '^version/' export_presets.cfg

      - name: Import assets (with ETC2/ASTC textures for phones)
        run: |
          $GODOT --headless --path . --import || true
          N=$(find .godot/imported -type f | wc -l)
          echo "imported files: $N"
          if [ "$N" -lt 500 ]; then $GODOT --headless --path . --import || true; N=$(find .godot/imported -type f | wc -l); echo "after a second pass: $N"; fi
          test "$N" -ge 500

      - name: Export APK
        run: |
          mkdir -p build/android
          $GODOT --headless --path . --export-release "Android" build/android/PlasticPlatoon.apk
          test -s build/android/PlasticPlatoon.apk
          ls -la build/android
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs build/android/PlasticPlatoon.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: PlasticPlatoon-android
          path: build/android/PlasticPlatoon.apk

      - name: Attach to release
        if: ${{ inputs.release != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/android/PlasticPlatoon.apk PlasticPlatoon-android.apk
          gh release upload "${{ inputs.release }}" PlasticPlatoon-android.apk --clobber

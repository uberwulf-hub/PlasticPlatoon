# Builds the Android APK (arm64, sideload). Run it from the Actions tab:
# "Android" -> "Run workflow". The APK is kept as a workflow artifact, and when
# "release" names an existing GitHub release (e.g. v1.10.0) it is attached there too.
#
# Signing: set the repository secrets ANDROID_KEYSTORE_BASE64 (base64 of a .jks/.keystore),
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD so every build is signed with the same key and
# installs over the last one. Without them a throwaway key is made for each build, which
# works, but phones then need the old version uninstalled before updating.
name: Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. v1.10.0 (sets the APK's version name/code)"
        required: true
        default: "v1.0.0"
      release:
        description: "Attach the APK to this existing release tag (leave empty to skip)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT: ./Godot_v4.3-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot 4.3 and the Android export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          T=~/.local/share/godot/export_templates/4.3.stable
          mkdir -p $T
          unzip -q -j Godot_v4.3-stable_export_templates.tpz templates/version.txt templates/android_release.apk templates/android_debug.apk -d $T
          rm Godot_v4.3-stable_export_templates.tpz

      - name: Point Godot at the Android SDK and Java
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.3.tres
          cat ~/.config/godot/editor_settings-4.3.tres
          ls "$ANDROID_HOME/build-tools"

      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            ALIAS="$KS_ALIAS"; PASS="$KS_PASS"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; signing with a throwaway key."
            ALIAS=platoon; PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore "$KS" -alias "$ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Plastic Platoon"
          fi
          echo "::add-mask::$PASS"
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"

      - name: Set the version
        run: |
          V="${{ inputs.version }}"; V="${V#v}"
          IFS=. read -r A B C <<< "$V"
          CODE=$(( ${A:-0} * 10000 + ${B:-0} * 100 + ${C:-0} ))
          sed -i "s/^version\/code=.*/version\/code=$CODE/; s/^version\/name=.*/version\/name=\"$V\"/" export_presets.cfg
          grep '^version/' export_presets.cfg

      - name: Import assets (with ETC2/ASTC textures for phones)
        run: $GODOT --headless --editor --quit || true

      - name: Export APK
        run: |
          mkdir -p build/android
          $GODOT --headless --path . --export-release "Android" build/android/PlasticPlatoon.apk
          test -s build/android/PlasticPlatoon.apk
          ls -la build/android
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs build/android/PlasticPlatoon.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: PlasticPlatoon-android
          path: build/android/PlasticPlatoon.apk

      - name: Attach to release
        if: ${{ inputs.release != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/android/PlasticPlatoon.apk PlasticPlatoon-android.apk
          gh release upload "${{ inputs.release }}" PlasticPlatoon-android.apk --clobber
